name: Publish native SEJIRE preview to GitHub Pages

# Only the temporary Pages preview is published. Arweave/ArNS are not touched.
on:
  workflow_dispatch:
    inputs:
      checked_run:
        description: 'Successful SEJIRE checks run for this exact source commit'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Recover and verify the accepted native build; preserve existing Pages files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED_RUN: ${{ inputs.checked_run }}
        run: node scripts/pages-native-artifact.mjs
      - name: Save Pages content without rewriting its history
        run: |
          git -C .pages-site config user.name 'SEJIRE Pages'
          git -C .pages-site config user.email 'sejire-pages@users.noreply.github.com'
          git -C .pages-site add -- native-admin
          if ! git -C .pages-site diff --cached --quiet; then
            git -C .pages-site commit -m "Publish verified native admin ${GITHUB_SHA} in native-admin/"
            git -C .pages-site push origin HEAD:gh-pages
          fi
          mkdir .pages-public
          git -C .pages-site archive HEAD | tar -x -C .pages-public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-public
      - name: Deploy preserved static site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install browser verification tools (Ubuntu only)
        run: |
          npm ci --prefix apps/web
          npm exec --prefix apps/web -- playwright install --with-deps chromium
      - name: Verify actual public HTTPS application in fresh browser contexts
        run: node scripts/verify-public-native.mjs
      - name: Preserve public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pages-browser-evidence
          path: .pages-evidence
