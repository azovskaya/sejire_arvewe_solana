name: SEJIRE checks
on:
  pull_request:
  push:
    branches: [main, feat/solana-preservation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/sponsor/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/sponsor
      - run: npm test
      - run: npm run check --prefix apps/sponsor
      - run: npm run test:checkout
      - run: npm run lint --prefix apps/web
      - run: npm run archive:measure
      - run: npm run solana:build
      - name: Web dependency audit (non-blocking; release review required)
        continue-on-error: true
        run: npm audit --prefix apps/web --omit=dev
      - name: Sponsor dependency audit (non-blocking; release review required)
        continue-on-error: true
        run: npm audit --prefix apps/sponsor --omit=dev
